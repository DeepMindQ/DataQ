  <tr>
    <td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #E5E7F0;border-radius:12px;overflow:hidden;">
        <tr>
          <td style="background:#18142D;padding:20px 28px;">
            <img src="https://www.dataqsoft.com/logo-white.svg" alt="Dataq Software" height="26" style="display:block;border:0;" />
          </td>
        </tr>
        <tr>
          <td style="padding:8px 28px 0;">
            <div style="width:24px;height:3px;background:#FE5722;border-radius:2px;margin-top:18px;"></div>
          </td>
        </tr>
        <tr>
          <td style="padding:10px 28px 28px;color:#46425A;font-size:14px;line-height:1.65;">
            {{BODY}}
          </td>
        </tr>
        <tr>
          <td style="border-top:1px solid #E5E7F0;padding:16px 28px;color:#8a86a3;font-size:11px;">
            © Dataq Software Corporation · <a href="https://www.dataqsoft.com" style="color:#C2410C;text-decoration:none;">www.dataqsoft.com</a>
            · SOC 2 Type II · ISO 27001 · Zero-exposure delivery

        </tr>
      </table>
    </td>
  </tr>
</table>
